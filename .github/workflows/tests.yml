name: "Tests"

on:
  push:
    branches:
      - "master"
      - "main"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    paths-ignore:
      - "**.md"

jobs:
  Tests:
    strategy:
      matrix:
        go-version:
          - 1.26.x
        platform:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '${{ matrix.go-version }}'
          cache: false
      - name: Run test
        run: go test -v -race ./...
