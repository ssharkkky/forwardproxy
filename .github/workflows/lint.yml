name: Lint

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  # From https://github.com/golangci/golangci-lint-action
  golangci:
    permissions:
      contents: read # for actions/checkout to fetch code
      pull-requests: read # for golangci/golangci-lint-action to fetch pull requests
    name: lint
    strategy:
      matrix:
        os:
          - linux
          - windows

        include:
        - os: linux
          OS_LABEL: ubuntu-latest

        - os: windows
          OS_LABEL: windows-latest
    runs-on: ${{ matrix.OS_LABEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
          cache: false

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run vet diagnostics
        shell: bash
        run: |
          if ! go vet ./...; then
            echo '::warning::go vet reports the repository baseline diagnostics; see the job log'
          fi

